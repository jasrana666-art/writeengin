services:
  - type: web
    name: WriteEngin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        value: writeengin-production-key-2026
      - key: FLASK_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: writeengin-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: writeengin-db
    plan: free
    databaseName: writeengin
    user: writeengin
