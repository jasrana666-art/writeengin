<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WriteEngin — Social Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
        body { min-height:100vh; background:#09090b; color:#fafafa; }
        .top-nav { display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; border-bottom:1px solid #27272a; position:sticky; top:0; z-index:100; background:rgba(9,9,11,0.8); backdrop-filter:blur(12px); }
        .nav-logo { display:flex; align-items:center; gap:0.5rem; font-weight:800; font-size:1.25rem; text-decoration:none; color:#fafafa; }
        .nav-logo .icon { width:32px; height:32px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .nav-links { display:flex; gap:2rem; } .nav-links a { color:#a1a1aa; text-decoration:none; font-size:0.9rem; } .nav-links a.active { color:#fafafa; }
        .user-avatar { width:36px; height:36px; background:linear-gradient(135deg,#6366f1,#ec4899); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; }
        .container { max-width:1200px; margin:0 auto; padding:2rem; }
        .page-header { margin-bottom:2rem; } .page-header h1 { font-size:2rem; font-weight:800; margin-bottom:0.5rem; } .page-header p { color:#71717a; }
        .main-grid { display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
        .form-card, .output-card { background:#11181b; border:1px solid #1e293b; border-radius:1rem; padding:2rem; }
        .form-card h3, .output-header h3 { font-size:1.1rem; font-weight:700; margin-bottom:1.5rem; }
        .form-field { margin-bottom:1.25rem; } .form-field label { display:block; font-weight:600; font-size:0.85rem; color:#a1a1aa; margin-bottom:0.5rem; }
        .form-field input, .form-field textarea, .form-field select { width:100%; padding:0.75rem 1rem; background:#0f172a; border:1px solid #1e293b; border-radius:0.5rem; color:#fafafa; font-size:0.95rem; outline:none; }
        .form-field input:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
        .generate-btn { width:100%; padding:1rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border:none; border-radius:0.75rem; font-weight:700; font-size:1.05rem; cursor:pointer; transition:all 0.3s; box-shadow:0 4px 14px rgba(99,102,241,0.35); margin-top:1rem; }
        .generate-btn:hover { transform:translateY(-2px); }
        .output-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
        .action-btn { padding:0.5rem 1rem; background:transparent; border:1px solid #334155; border-radius:0.5rem; color:#a1a1aa; font-size:0.85rem; cursor:pointer; transition:all 0.2s; }
        .action-btn:hover { border-color:#6366f1; color:#818cf8; }
        .action-btn.primary { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border:none; }
        .post-card { background:#0f172a; border:1px solid #1e293b; border-radius:0.75rem; padding:1.5rem; margin-bottom:1rem; }
        .post-card .platform { display:inline-block; padding:0.25rem 0.75rem; background:rgba(99,102,241,0.1); border-radius:9999px; color:#818cf8; font-size:0.7rem; font-weight:600; margin-bottom:0.75rem; }
        .post-card .content { color:#a1a1aa; line-height:1.7; margin-bottom:1rem; }
        .post-meta { display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; color:#52525b; }
        .schedule-btn { padding:0.25rem 0.75em; background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.2); border-radius:0.5rem; color:#34d399; font-size:0.75rem; cursor:pointer; }
        @media(max-width:768px) { .main-grid{grid-template-columns:1fr} .nav-links{display:none} }
    </style>
</head>
<body>
    <nav class="top-nav"><a href="/" class="nav-logo"><div class="icon">⚡</div> WriteEngin</a><div class="nav-links"><a href="/dashboard">Dashboard</a><a href="/tools/blog-writer">Blog</a><a href="/tools/social-media" class="active">Social</a><a href="/tools/seo">SEO</a><a href="/pricing">Pricing</a></div><div class="nav-actions"><div class="user-avatar">U</div></div></nav>
    <div class="container">
        <div class="page-header"><h1>Social Media Generator</h1><p>Create & schedule posts for all platforms.</p></div>
        <div class="main-grid">
            <div class="form-card"><h3>Post Configuration</h3>
                <div class="form-field"><label>Platform</label><select id="platform"><option value="twitter">Twitter / X</option><option value="instagram">Instagram</option><option value="linkedin">LinkedIn</option></select></div>
                <div class="form-field"><label>Brand Name</label><input type="text" id="brand" placeholder="e.g., My Brand"></div>
                <div class="form-field"><label>Topic</label><input type="text" id="topic" placeholder="e.g., Digital Marketing Tips"></div>
                <div class="form-field"><label>Tone</label><select id="tone"><option>Professional</option><option>Casual</option><option>Humorous</option><option>Inspirational</option></select></div>
                <div class="form-field"><label>Number of Posts</label><select id="count"><option value="3">3 Posts</option><option value="5" selected>5 Posts</option><option value="10">10 Posts</option></select></div>
                <button class="generate-btn" onclick="generatePosts()">🚀 Generate Posts</button>
            </div>
            <div class="output-card"><div class="output-header"><h3>Generated Posts</h3><div><button class="action-btn" onclick="copyAll()">📋 Copy All</button></div></div>
                <div id="postsContainer"><div style="text-align:center;padding:4rem;color:#475569"><div style="font-size:3rem;margin-bottom:1rem">📱</div><p>Configure your platform and click generate.</p></div></div>
            </div>
        </div>
    </div>
    <script>
        async function generatePosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '<div style="text-align:center;padding:4rem"><div style="font-size:3rem;margin-bottom:1rem">⏳</div><p>Generating posts...</p></div>';
            try {
                const res = await fetch('/api/generate-social', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({platform:document.getElementById('platform').value, brand:document.getElementById('brand').value, topic:document.getElementById('topic').value, tone:document.getElementById('tone').value, count:document.getElementById('count').value }) });
                const data = await res.json();
                if(data.success) {
                    container.innerHTML = data.posts.map(p => `<div class="post-card"><span class="platform">${p.platform.toUpperCase()}</span><div class="content">${p.content.replace(/\n/g,'<br>')}</div><div class="post-meta"><span>${p.char_count} chars • ${p.best_post_time}</span><span style="color:#818cf8">Engagement: ${p.engagement}%</span><button class="schedule-btn" onclick="schedulePost(${p.id})">📅 Schedule</button></div></div>`).join('');
                }
            } catch(e) { container.innerHTML = '<div style="text-align:center;padding:4rem;color:#ef4444"><p>Error. Try again.</p></div>'; }
        }
        function schedulePost(id) { alert('Post '+id+' scheduled!'); }
        function copyAll() { const texts = Array.from(document.querySelectorAll('.post-card .content')).map(e=>e.innerText).join('\n\n'); navigator.clipboard.writeText(texts); alert('Copied!'); }
    </script>
</body>
</html>
