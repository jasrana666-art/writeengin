<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Generator — gennim.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
        body { min-height:100vh; background:#09090b; color:#fafafa; }
        .top-nav { display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; border-bottom:1px solid #27272a; background:#09090b; position:sticky; top:0; z-index:100; }
        .nav-logo { display:flex; align-items:center; gap:0.5rem; font-weight:800; font-size:1.25rem; text-decoration:none; color:#fafafa; }
        .nav-logo .icon { width:32px; height:32px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
        .main-layout { display:flex; min-height:calc(100vh - 65px); }
        .sidebar { width:240px; padding:1.5rem 1rem; border-right:1px solid #1a1a1c; background:#0c0c0e; }
        .sidebar-link { display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1rem; color:#a1a1aa; text-decoration:none; border-radius:0.5rem; font-size:0.9rem; margin-bottom:0.25rem; cursor:pointer; }
        .sidebar-link:hover { background:#18181b; color:#fafafa; }
        .sidebar-link.active { background:rgba(99,102,241,0.1); color:#818cf8; }
        .main-content { flex:1; padding:2rem; max-width:1200px; }
        .tool-header h1 { font-size:2rem; font-weight:800; margin-bottom:0.5rem; }
        .tool-header p { color:#a1a1aa; margin-bottom:2rem; }
        .form-group { margin-bottom:1.5rem; }
        .form-group label { display:block; font-weight:600; margin-bottom:0.5rem; color:#e8eaed; font-size:0.9rem; }
        .form-group input, .form-group select { width:100%; padding:0.75rem 1rem; background:#18181b; border:1px solid #27272a; border-radius:0.5rem; color:#fafafa; font-size:0.95rem; }
        .form-group input:focus, .form-group select:focus { outline:none; border-color:#6366f1; }
        .generate-btn { padding:0.875rem 2rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border:none; border-radius:0.5rem; font-weight:700; font-size:1rem; cursor:pointer; }
        .generate-btn:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(99,102,241,0.4); }
        .generate-btn:disabled { opacity:0.5; }
        .output-box { background:#11181b; border:1px solid #1e293b; border-radius:1rem; padding:1.5rem; margin-top:2rem; white-space:pre-wrap; font-family:'JetBrains Mono',monospace; font-size:0.9rem; line-height:1.7; color:#e8eaed; }
        .meta-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-top:1.5rem; }
        .meta-card { background:#18181b; border:1px solid #27272a; border-radius:0.75rem; padding:1rem; }
        .meta-card .label { color:#a1a1aa; font-size:0.8rem; margin-bottom:0.25rem; }
        .meta-card .value { font-size:1.1rem; font-weight:700; }
        .meta-card .value.highlight { color:#34d399; }
        .clickbait-options { display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:1rem; }
        .style-btn { padding:0.5rem 1rem; background:#18181b; border:1px solid #27272a; border-radius:0.5rem; color:#a1a1aa; cursor:pointer; font-size:0.85rem; }
        .style-btn:hover, .style-btn.active { border-color:#6366f1; color:#fafafa; background:rgba(99,102,241,0.1); }
        @media(max-width:768px) { .sidebar{display:none} }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/dashboard" class="nav-logo"><div class="icon">🖼️</div> gennim.ai</a>
        <div class="main-content" style="flex:1;padding:2rem;">
            <div class="tool-header">
                <h1>🖼️ Thumbnail Prompt Generator</h1>
                <p>Generate AI image prompts for eye-catching YouTube thumbnails.</p>
            </div>
            <div class="form-group">
                <label>Video Title</label>
                <input type="text" id="thumb-title" placeholder="e.g. I Tried 10 AI Tools For 30 Days" style="font-size:1.1rem; padding:1rem;">
            </div>
            <div class="form-group">
                <label>Style</label>
                <div class="clickbait-options">
                    <span class="style-btn active" onclick="setThumbStyle(this,'clickbait')">Clickbait</span>
                    <span class="style-btn" onclick="setThumbStyle(this,'professional')">Professional</span>
                    <span class="style-btn" onclick="setThumbStyle(this,'minimal')">Minimal</span>
                    <span class="style-btn" onclick="setThumbStyle(this,'bold')">Bold</span>
                </div>
            </div>
            <button class="generate-btn" id="thumb-generate" onclick="generateThumbnail()">Generate Thumbnail Prompt</button>
            <div id="thumb-output" style="display:none; margin-top:2rem;">
                <div class="output-box" id="thumb-prompt"></div>
                <div class="meta-grid">
                    <div class="meta-card"><div class="label">Suggested Text Overlay</div><div class="value" id="thumb-text"></div></div>
                    <div class="meta-card"><div class="label">Color Scheme</div><div class="value" id="thumb-color"></div></div>
                    <div class="meta-card"><div class="label">Clickbait Score</div><div class="value highlight" id="thumb-score"></div></div>
                </div>
            </div>
        </div>
    </nav>
    <script>
        let thumbStyle = 'clickbait';
        function setThumbStyle(el, style) {
            document.querySelectorAll('.clickbait-options .style-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            thumbStyle = style;
        }
        async generateThumbnail() {
            const title = document.getElementById('thumb-title').value;
            if (!title) return alert('Enter a video title');
            const btn = document.getElementById('thumb-generate');
            btn.disabled = true; btn.textContent = 'Generating...';
            const resp = await fetch('/api/generate-thumbnail', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ video_title: title, style: thumbStyle })
            });
            const data = await resp.json();
            btn.disabled = false; btn.textContent = 'Generate Thumbnail Prompt';
            if (data.success) {
                document.getElementById('thumb-output').style.display = 'block';
                document.getElementById('thumb-prompt').textContent = data.thumbnail_prompt;
                document.getElementById('thumb-text').textContent = data.suggested_text;
                document.getElementById('thumb-color').textContent = data.color_scheme;
                document.getElementById('thumb-score').textContent = data.clickbait_score + '/100';
            }
        }
    </script>
</body>
</html>
