<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WriteEngin — Blog Writer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
        body { min-height:100vh; background:#09090b; color:#fafafa; }
        .top-nav { display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; border-bottom:1px solid #27272a; position:sticky; top:0; z-index:100; background:rgba(9,9,11,0.8); backdrop-filter:blur(12px); }
        .nav-logo { display:flex; align-items:center; gap:0.5rem; font-weight:800; font-size:1.25rem; text-decoration:none; color:#fafafa; }
        .nav-logo .icon { width:32px; height:32px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .nav-links { display:flex; gap:2rem; }
        .nav-links a { color:#a1a1aa; text-decoration:none; font-size:0.9rem; }
        .nav-links a.active { color:#fafafa; }
        .nav-actions { display:flex; align-items:center; gap:1rem; }
        .user-avatar { width:36px; height:36px; background:linear-gradient(135deg,#6366f1,#ec4899); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; }
        .container { max-width:1200px; margin:0 auto; padding:2rem; }
        .page-header { margin-bottom:2rem; }
        .page-header h1 { font-size:2rem; font-weight:800; margin-bottom:0.5rem; }
        .page-header p { color:#71717a; }
        .main-grid { display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
        .form-card { background:#11181b; border:1px solid #1e293b; border-radius:1rem; padding:2rem; }
        .form-card h3 { font-size:1.1rem; font-weight:700; margin-bottom:1.5rem; }
        .form-field { margin-bottom:1.25rem; }
        .form-field label { display:block; font-weight:600; font-size:0.85rem; color:#a1a1aa; margin-bottom:0.5rem; }
        .form-field input, .form-field textarea, .form-field select { width:100%; padding:0.75rem 1rem; background:#0f172a; border:1px solid #1e293b; border-radius:0.5rem; color:#fafafa; font-size:0.95rem; outline:none; }
        .form-field input:focus, .form-field textarea:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
        .generate-btn { width:100%; padding:1rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border:none; border-radius:0.75rem; font-weight:700; font-size:1.05rem; cursor:pointer; transition:all 0.3s; box-shadow:0 4px 14px rgba(99,102,241,0.35); margin-top:1rem; }
        .generate-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,102,241,0.5); }
        .output-card { background:#11181b; border:1px solid #1e293b; border-radius:1rem; padding:2rem; min-height:400px; }
        .output-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
        .output-header h3 { font-size:1.1rem; font-weight:700; }
        .action-btns { display:flex; gap:0.5rem; }
        .action-btn { padding:0.5rem 1rem; background:transparent; border:1px solid #334155; border-radius:0.5rem; color:#a1a1aa; font-size:0.85rem; cursor:pointer; transition:all 0.2s; }
        .action-btn:hover { border-color:#6366f1; color:#818cf8; }
        .action-btn.primary { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border:none; }
        .output-content { color:#a1a1aa; line-height:1.7; white-space:pre-wrap; background:#0f172a; padding:1.5rem; border-radius:0.5rem; border:1px solid #1e293b; max-height:500px; overflow-y:auto; }
        .placeholder-text { color:#475569; text-align:center; padding:4rem 2rem; }
        .placeholder-text .icon { font-size:4rem; margin-bottom:1rem; }
        @media(max-width:768px) { .main-grid{grid-template-columns:1fr} .nav-links{display:none} }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/" class="nav-logo"><div class="icon">⚡</div> WriteEngin</a>
        <div class="nav-links"><a href="/dashboard">Dashboard</a><a href="/tools/blog-writer" class="active">Blog</a><a href="/tools/social-media">Social</a><a href="/tools/seo">SEO</a><a href="/pricing">Pricing</a></div>
        <div class="nav-actions"><div class="user-avatar">U</div></div>
    </nav>
    <div class="container">
        <div class="page-header"><h1>AI Blog Writer</h1><p>Generate complete, SEO-optimized blog posts in seconds.</p></div>
        <div class="main-grid">
            <div class="form-card">
                <h3>Blog Configuration</h3>
                <div class="form-field"><label>Blog Topic *</label><input type="text" id="topic" placeholder="e.g., Digital Marketing Trends 2026"></div>
                <div class="form-field"><label>Tone</label><select id="tone"><option>Professional</option><option>Casual</option><option>Authoritative</option><option>Conversational</option></select></div>
                <div class="form-field"><label>Target Keywords</label><input type="text" id="keywords" placeholder="e.g., digital marketing, growth strategy"></div>
                <div class="form-field"><label>Length</label><select id="length"><option value="short">Short (~500 words)</option><option value="medium" selected>Medium (~1200 words)</option><option value="long">Long (~2500 words)</option></select></div>
                <button class="generate-btn" onclick="generateBlog()">🚀 Generate Blog Post</button>
            </div>
            <div class="output-card">
                <div class="output-header"><h3>Generated Content</h3><div class="action-btns"><button class="action-btn" onclick="copyContent()">📋 Copy</button><button class="action-btn primary" onclick="downloadContent()">⬇️ Download</button></div></div>
                <div class="output-content" id="outputContent"><div class="placeholder-text"><div class="icon">📝</div><p>Configure your blog topic and click generate to see the magic happen.</p></div></div>
            </div>
        </div>
    </div>
    <script>
        async function generateBlog() {
            const topic = document.getElementById('topic').value;
            if (!topic) { alert('Please enter a blog topic!'); return; }
            const output = document.getElementById('outputContent');
            output.innerHTML = '<div style="text-align:center;padding:4rem"><div style="font-size:3rem;margin-bottom:1rem">⏳</div><p>Generating your blog post...</p></div>';
            try {
                const res = await fetch('/api/generate-blog', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({topic, tone:document.getElementById('tone').value, length:document.getElementById('length').value, keywords:document.getElementById('keywords').value }) });
                const data = await res.json();
                if(data.success) {
                    output.innerHTML = `<h2 style="color:#6366f1;margin-bottom:1rem">${data.headline}</h2><div style="color:#a1a1aa;line-height:1.8">${data.word_count} words | SEO Score: ${data.seo_score}/100</div><hr style="border-color:#27272a;margin:1rem 0"><div>${data.content}</div>`;
                }
            } catch(e) { output.innerHTML = '<div class="placeholder-text"><p style="color:#ef4444">Error generating content. Try again.</p></div>'; }
        }
        function copyContent() { navigator.clipboard.writeText(document.getElementById('outputContent').innerText); alert('Copied!'); }
        function downloadContent() { const blob = new Blob([document.getElementById('outputContent').innerHTML], {type:'text/html'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'blog-post.html'; a.click(); }
    </script>
</body>
</html>
