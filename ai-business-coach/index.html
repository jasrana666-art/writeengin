<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Coach</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        h1 { text-align: center; margin-bottom: 0.5rem; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }
        .chat-box { background: #1e293b; border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; height: 400px; overflow-y: auto; border: 1px solid #334155; }
        .message { margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 0.75rem; max-width: 80%; line-height: 1.5; }
        .user { background: #3b82f6; color: white; margin-left: auto; text-align: right; }
        .bot { background: #334155; color: #e2e8f0; }
        .bot strong { color: #60a5fa; }
        .input-area { display: flex; gap: 0.5rem; }
        input { flex: 1; padding: 0.875rem 1rem; border: 1px solid #475569; border-radius: 0.5rem; background: #1e293b; color: white; font-size: 0.95rem; }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        button { padding: 0.875rem 1.5rem; background: #3b82f6; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        button:hover { background: #2563eb; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .quick-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .quick-btn { padding: 0.5rem 1rem; background: #1e293b; border: 1px solid #475569; border-radius: 0.5rem; color: #94a3b8; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .quick-btn:hover { border-color: #3b82f6; color: #60a5fa; }
        .typing { display: inline-block; }
        .typing::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Business Coach</h1>
        <p class="subtitle">Start your business with 15 free tools — $0 investment</p>
        
        <div class="quick-actions">
            <button class="quick-btn" onclick="sendQuick('I want to start a business with $0')">Start with $0</button>
            <button class="quick-btn" onclick="sendQuick('Suggest 5 business ideas for me')">Business Ideas</button>
            <button class="quick-btn" onclick="sendQuick('What free tools do I need?')">Free Tools</button>
            <button class="quick-btn" onclick="sendQuick('Create a business plan for me')">Business Plan</button>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot">Hello! I'm your <strong>AI Business Coach</strong>. I'll help you start a business using only free tools — no investment needed.<br><br>Ask me anything or click a quick action above to get started.</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const TOOLS_DB = [
            { name: "Instagram", category: "Brand", use: "Visual content, reels, stories", link: "https://instagram.com" },
            { name: "Canva", category: "Design", use: "Graphics, presentations, logos", link: "https://canva.com" },
            { name: "Wegic.ai", category: "Website", use: "AI website builder, no coding", link: "https://wegic.ai" },
            { name: "Beehiiv", category: "Email", use: "Newsletter, email sequences", link: "https://beehiiv.com" },
            { name: "ChatGPT", category: "Content", use: "Blog posts, captions, copy", link: "https://chat.openai.com" },
            { name: "Virality AI", category: "Viral", use: "Viral content ideas, optimization", link: "https://viralityai.net" },
            { name: "Gumroad", category: "Store", use: "Digital products, courses", link: "https://gumroad.com" },
            { name: "Wave", category: "Finance", use: "Invoicing, payments, accounting", link: "https://waveapps.com" },
            { name: "Trello", category: "Management", use: "Task management, workflows", link: "https://trello.com" },
            { name: "Make", category: "Automation", use: "Workflow automation, integrations", link: "https://make.com" },
            { name: "GnuCash", category: "Accounting", use: "Bookkeeping, financial reports", link: "https://gnucash.org" },
            { name: "HubSpot CRM", category: "CRM", use: "Customer management, sales pipeline", link: "https://hubspot.com" },
            { name: "Toggl", category: "Time", use: "Time tracking, productivity", link: "https://toggl.com" },
            { name: "Google Drive", category: "Storage", use: "File storage, collaboration", link: "https://drive.google.com" },
            { name: "Notion", category: "Workspace", use: "Notes, docs, databases", link: "https://notion.so" }
        ];

        const SYSTEM_PROMPT = `You are an AI Business Coach. Help users start businesses with free tools. 
You have access to 15 free tools: Instagram, Canva, Wegic.ai, Beehiiv, ChatGPT, Virality AI, Gumroad, Wave, Trello, Make, GnuCash, HubSpot CRM, Toggl, Google Drive, Notion.
Be concise, practical, and encouraging. Give actionable steps. Use bullet points for lists. Keep responses under 200 words.`;

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            const userMessage = input.value.trim();
            if (!userMessage) return;
            
            chatBox.innerHTML += `<div class="message user">${escapeHtml(userMessage)}</div>`;
            input.value = '';
            sendBtn.disabled = true;
            
            const typingId = 'typing-' + Date.now();
            chatBox.innerHTML += `<div class="message bot" id="${typingId}"><span class="typing">Thinking</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-or-v1-demo'
                    },
                    body: JSON.stringify({
                        model: 'meta-llama/llama-3.3-70b-instruct:free',
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            { role: 'user', content: userMessage }
                        ],
                        max_tokens: 500
                    })
                });
                
                const data = await response.json();
                const botMessage = data.choices?.[0]?.message?.content || 'Sorry, I could not generate a response. Please try again.';
                
                document.getElementById(typingId).remove();
                chatBox.innerHTML += `<div class="message bot">${formatMessage(botMessage)}</div>`;
            } catch (error) {
                document.getElementById(typingId).remove();
                chatBox.innerHTML += `<div class="message bot">Demo mode: Add your OpenRouter API key to enable AI responses. Here are 15 free tools to start your business:<br><br>${TOOLS_DB.map(t => `<strong>${t.name}</strong> (${t.category}) — ${t.use}`).join('<br>')}</div>`;
            }
            
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendQuick(message) {
            document.getElementById('userInput').value = message;
            sendMessage();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMessage(text) {
            return escapeHtml(text)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>')
                .replace(/• /g, '&bull; ');
        }
    </script>
</body>
</html>
